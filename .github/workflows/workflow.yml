
name: GITHUB ACTIONS WORKFLOW

on:
  push:
    branches: [main, hibernate]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: delihelper
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d delihelper"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: delihelper
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PRODUCTION: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build application JAR
        run: mvn --batch-mode package -DskipTests

      - name: Verify JAR
        run: test -f target/app.jar

      - name: Start API
        run: |
          nohup java -jar target/app.jar > /tmp/delihelper.log 2>&1 &
          echo $! > /tmp/delihelper.pid

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent \
              http://localhost:7070/api/auth/healthcheck; then
              echo "API is ready"
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/delihelper.pid)" 2>/dev/null; then
              echo "API process exited unexpectedly"
              cat /tmp/delihelper.log
              exit 1
            fi

            sleep 2
          done

          echo "API did not become ready in time"
          cat /tmp/delihelper.log
          exit 1

      - name: Run tests
        run: mvn --batch-mode test

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/delihelper:latest
