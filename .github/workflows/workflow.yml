  name: GITHUB ACTIONS WORKFLOW

  on:
    push:
      branches: [main, hibernate]
    pull_request:
      branches: [main]

  jobs:
    build:
      runs-on: ubuntu-latest

      services:
        postgres:
          image: postgres:16
          env:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: DeliHelper
          ports:
            - 5432:5432
          options: >-
            --health-cmd "pg_isready -U postgres -d DeliHelper"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up JDK 17
          uses: actions/setup-java@v5
          with:
            java-version: '17'
            distribution: temurin
            cache: maven

        - name: Verify build files
          run: |
            echo "Current directory:"
            pwd
            echo "Repository files:"
            ls -la
            test -f pom.xml
            test -f Dockerfile

        - name: Build with Maven
          run: mvn --batch-mode --update-snapshots package

        - name: Login to Docker Hub
          if: github.event_name == 'push'
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Set up Docker Buildx
          if: github.event_name == 'push'
          uses: docker/setup-buildx-action@v3

        - name: Debug repository files
          run: |
            echo "Branch: $GITHUB_REF"
            echo "Workspace: $GITHUB_WORKSPACE"
            ls -la
            find . -maxdepth 4 -type f -iname '*dockerfile*' -not -path './.git/*'
            git ls-files | grep -i dockerfile || true

        - name: Build and push
          if: github.event_name == 'push'
          uses: docker/build-push-action@v6
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: ${{ secrets.DOCKERHUB_USERNAME }}/delihelper:latest